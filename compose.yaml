services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage-db:
    image: pgvector/pgvector:0.8.6-pg16@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
    platform: linux/amd64
    environment:
      POSTGRES_DB: longitudinal_memory
      POSTGRES_PASSWORD: storage_test
      POSTGRES_USER: storage_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U storage_test -d longitudinal_memory"]
      start_period: 15s
      interval: 1s
      timeout: 5s
      retries: 30
